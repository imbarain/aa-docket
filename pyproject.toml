[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-docket"
version = "0.2.0"
description = "Lifecycle docket and mechanical validator for evaluating agent capabilities (skills, MCP servers, CLIs)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "imbarain" }]
keywords = ["ai-agents", "mcp", "cli", "evaluation", "docket", "validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/imbarain/aa-docket"
Issues = "https://github.com/imbarain/aa-docket/issues"

[project.scripts]
aa-docket = "validate:cli_main"

[tool.hatch.build.targets.wheel]
include = ["validate.py"]
